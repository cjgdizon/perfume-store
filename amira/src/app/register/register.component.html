<div class="container page narrow">
  <div class="page-head">
    <span class="eyebrow">Join AMIRA</span>
    <h1>Create account</h1>
  </div>

  <form class="card stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="notice error" role="alert" *ngIf="error"><app-icon name="alert"></app-icon><span>{{ error }}</span></div>

    <div class="field">
      <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
      <input id="name" type="text" formControlName="name" autocomplete="name" [class.invalid]="invalid('name')" aria-describedby="name-err">
      <span id="name-err" class="error" role="alert" *ngIf="invalid('name')"><app-icon name="alert" [size]="14"></app-icon>Enter your name.</span>
    </div>

    <div class="field">
      <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
      <input id="email" type="email" formControlName="email" autocomplete="email" inputmode="email" [class.invalid]="invalid('email')" aria-describedby="email-err">
      <span id="email-err" class="error" role="alert" *ngIf="invalid('email')"><app-icon name="alert" [size]="14"></app-icon>Enter a valid email, like name&#64;example.com.</span>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="phone">Mobile number</label>
        <input id="phone" type="tel" formControlName="phone" autocomplete="tel" inputmode="tel">
      </div>
      <div class="field">
        <label for="pw">Password <span class="req" aria-hidden="true">*</span></label>
        <input id="pw" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" [class.invalid]="invalid('password')" aria-describedby="pw-hint pw-err">
        <span id="pw-hint" class="hint">At least 6 characters. <button type="button" class="link-btn" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword">{{ showPassword ? 'Hide' : 'Show' }}<span class="sr-only"> password</span></button></span>
        <span id="pw-err" class="error" role="alert" *ngIf="invalid('password')"><app-icon name="alert" [size]="14"></app-icon>Use at least 6 characters.</span>
      </div>
    </div>

    <div class="field">
      <label for="addr">Delivery address</label>
      <textarea id="addr" formControlName="shippingAddress" rows="2" autocomplete="street-address" aria-describedby="addr-hint"></textarea>
      <span id="addr-hint" class="hint">Optional now. You can add it at checkout.</span>
    </div>

    <button type="submit" class="btn block" [disabled]="submitting">{{ submitting ? 'Creating account…' : 'Create account' }}</button>
    <p class="small muted center">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
