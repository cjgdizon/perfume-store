<div class="container page narrow">
  <div class="page-head">
    <span class="eyebrow">Account help</span>
    <h1>Choose a new password</h1>
  </div>

  <div class="card stack" *ngIf="!token">
    <div class="notice error" role="alert"><app-icon name="alert"></app-icon><span>This page needs the link from your email. Open the link again, or request a new one.</span></div>
    <a routerLink="/forgot-password" class="btn">Request a new link</a>
  </div>

  <form class="card stack" *ngIf="token" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="notice error" role="alert" *ngIf="error">
      <app-icon name="alert"></app-icon>
      <span>{{ error }} <a routerLink="/forgot-password" *ngIf="linkProblem">Request a new link</a></span>
    </div>

    <div class="field">
      <label for="pw">New password</label>
      <input id="pw" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password"
        [class.invalid]="form.controls.password.invalid && form.controls.password.touched" aria-describedby="pw-hint pw-err">
      <span id="pw-hint" class="hint">At least 6 characters.
        <button type="button" class="link-btn" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword">{{ showPassword ? 'Hide' : 'Show' }}<span class="sr-only"> password</span></button>
      </span>
      <span id="pw-err" class="error" role="alert" *ngIf="form.controls.password.invalid && form.controls.password.touched">
        <app-icon name="alert" [size]="14"></app-icon>Use at least 6 characters.
      </span>
    </div>

    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" [type]="showPassword ? 'text' : 'password'" formControlName="confirm" autocomplete="new-password"
        [class.invalid]="form.hasError('mismatch') && form.controls.confirm.touched" aria-describedby="confirm-err">
      <span id="confirm-err" class="error" role="alert" *ngIf="form.hasError('mismatch') && form.controls.confirm.touched">
        <app-icon name="alert" [size]="14"></app-icon>The two passwords do not match.
      </span>
    </div>

    <button type="submit" class="btn block" [disabled]="submitting">{{ submitting ? 'Saving…' : 'Change password' }}</button>
  </form>
</div>
