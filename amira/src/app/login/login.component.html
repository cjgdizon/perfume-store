<div class="container page narrow">
  <div class="page-head">
    <span class="eyebrow">Welcome back</span>
    <h1>Sign in</h1>
  </div>

  <div class="notice warn" role="status" *ngIf="expired"><app-icon name="clock"></app-icon><span>Your session ended. Please sign in again.</span></div>

  <form class="card stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="notice error" role="alert" *ngIf="error"><app-icon name="alert"></app-icon><span>{{ error }}</span></div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" inputmode="email"
        [class.invalid]="form.controls.email.invalid && form.controls.email.touched" aria-describedby="email-err">
      <span id="email-err" class="error" role="alert" *ngIf="form.controls.email.invalid && form.controls.email.touched">
        <app-icon name="alert" [size]="14"></app-icon>Enter the email you registered with.
      </span>
    </div>

    <div class="field">
      <label for="pw">Password</label>
      <div class="pw">
        <input id="pw" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched" aria-describedby="pw-err">
        <button type="button" class="link-btn" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword">{{ showPassword ? 'Hide' : 'Show' }}<span class="sr-only"> password</span></button>
      </div>
      <span id="pw-err" class="error" role="alert" *ngIf="form.controls.password.invalid && form.controls.password.touched">
        <app-icon name="alert" [size]="14"></app-icon>Enter your password.
      </span>
    </div>

    <p class="forgot small"><a routerLink="/forgot-password">Forgot password?</a></p>
    <button type="submit" class="btn block" [disabled]="submitting">{{ submitting ? 'Signing in…' : 'Sign in' }}</button>
    <p class="small muted center">New here? <a routerLink="/register">Create an account</a></p>
  </form>
</div>
