server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Angular routes (/products, /cart, ...) are handled in the browser, so unknown paths return index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # hashed bundles and images can be cached; index.html must not be
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
